# Application AO — lancement : docker compose up -d --build
# (le script installer.ps1 fait tout automatiquement sous Windows)
name: application-ao

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  env_file: .env
  environment: &environnement
    POSTGRES_HOST: base
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /donnees/fichiers
    OLLAMA_URL: http://ollama:11434
    IA_DOSSIER_MODELES: /donnees/modeles-ia
  volumes:
    # Les fichiers importés restent visibles dans le dossier « donnees\fichiers » du PC.
    - ./donnees/fichiers:/donnees/fichiers
    # Modèles de voix de l'assistant (transcription et lecture à voix haute).
    - modeles_voix:/donnees/modeles-ia

services:
  base:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-application_ao}
      POSTGRES_USER: ${POSTGRES_USER:-application_ao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Lancez installer.ps1 ou renseignez POSTGRES_PASSWORD dans .env}
    volumes:
      - base_donnees:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped

  backend:
    <<: *backend
    environment:
      <<: *environnement
      INITIALISER: "1"
    depends_on:
      base:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      backend:
        condition: service_started

  # Moteur d'IA local de l'assistant (modèles gratuits, rien n'est envoyé sur Internet).
  # Carte graphique NVIDIA : voir docker-compose.gpu.yml.
  ollama:
    image: ollama/ollama:0.40.15
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - modeles_ia:/root/.ollama

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  base_donnees:
  modeles_ia:
  modeles_voix:
