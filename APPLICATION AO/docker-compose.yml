# D’Aplomb — lancement : docker compose up -d --build
# (le script installer.ps1 fait tout automatiquement sous Windows)
# « application-ao » est le nom technique du projet : ne le changez jamais, les volumes de
# données (base_donnees, modeles_ia…) portent ce préfixe et seraient perdus de vue.
name: application-ao

# Journaux des conteneurs : au plus 5 fichiers de 10 Mo par service, les plus anciens sont effacés.
# Sans cette limite, ils grossiraient sans fin dans le disque de Docker, celui de la base de données.
x-journal: &journal
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  env_file: .env
  logging: *journal
  environment: &environnement
    POSTGRES_HOST: base
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /donnees/fichiers
    OLLAMA_URL: http://ollama:11434
    IA_DOSSIER_MODELES: /donnees/modeles-ia
    # Archives de fin de chantier : dossier du PC (DOSSIER_ARCHIVES_PC) ou partage du serveur de l'agence.
    DOSSIER_ARCHIVES: /donnees/archives
    DOSSIER_ARCHIVES_AFFICHE: ${DOSSIER_ARCHIVES_PC:-donnees\archives}
    # Sauvegardes de chaque nuit (dossier /sauvegardes) : emplacement affiché dans l'application.
    DOSSIER_SAUVEGARDES_AFFICHE: ${DOSSIER_SAUVEGARDES_PC:-donnees\sauvegardes}
    # Fichiers sur ce PC. docker-compose.serveur.yml passe STOCKAGE_SERVEUR à 1 et indique le chemin
    # du partage : ces valeurs suivent ainsi les volumes réellement montés, quel que soit le .env.
    STOCKAGE_SERVEUR: "0"
    SERVEUR_CHEMIN_AFFICHE: ""
    # Le mot de passe du partage ne sert qu'à Docker pour monter les volumes du serveur :
    # il n'est pas transmis aux conteneurs (le worker le sauvegarde avec le fichier .env).
    SERVEUR_MOT_DE_PASSE: ""
  volumes:
    # Les fichiers importés restent visibles dans le dossier « donnees\fichiers » du PC.
    # Stockage sur le serveur : installer.ps1 renseigne VOLUME_FICHIERS et VOLUME_ARCHIVES dans .env
    # (volumes de docker-compose.serveur.yml), pour que le service « ged » des fichiers internet et
    # tunnel, qui reprend ces deux montages, voie lui aussi les fichiers du serveur.
    - &montage-fichiers ${VOLUME_FICHIERS:-./donnees/fichiers}:/donnees/fichiers
    - &montage-archives ${VOLUME_ARCHIVES:-${DOSSIER_ARCHIVES_PC:-./donnees/archives}}:/donnees/archives
    # Modèles de voix de l'assistant (transcription et lecture à voix haute).
    - &montage-modeles modeles_voix:/donnees/modeles-ia

services:
  base:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *journal
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-application_ao}
      POSTGRES_USER: ${POSTGRES_USER:-application_ao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Lancez installer.ps1 ou renseignez POSTGRES_PASSWORD dans .env}
    # La base reste toujours sur ce PC (disque de Docker) : sa copie de chaque nuit part dans /sauvegardes.
    volumes:
      - base_donnees:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # File des tâches de fond et repères des tâches planifiées (dernier récapitulatif du matin de la GED) :
  # Valkey les enregistre dans son volume, ils survivent donc à « docker compose down ».
  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    logging: *journal
    volumes:
      - valkey_donnees:/data

  backend:
    <<: *backend
    environment:
      <<: *environnement
      INITIALISER: "1"
    # Pas de dossier /sauvegardes : l'état des sauvegardes est lu dans la base. Seul le worker voit les
    # copies de la base et du .env.
    volumes:
      - *montage-fichiers
      - *montage-archives
      - *montage-modeles
    depends_on:
      base:
        condition: service_healthy
      redis:
        condition: service_started

  # Tâches de fond et tâches planifiées (--beat) : sauvegarde de chaque nuit, récapitulatif du matin de
  # la GED, relance des courriels non partis, purges programmées après archivage. La planification est
  # conservée sur le volume modeles_voix (survit à « docker compose down ») : une échéance manquée
  # (PC éteint la nuit) est rattrapée au démarrage.
  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--beat", "--schedule=/donnees/modeles-ia/planification-celery", "--loglevel=info", "--concurrency=2"]
    # Plafond de mémoire : un document hors normes (OCR d'une page géante) ne peut pas épuiser la
    # mémoire de Docker et faire tomber la base de données ou l'assistant. Chaque document est en outre lu
    # dans un processus séparé plafonné à LECTURE_MEMOIRE_MAX_MO (2 Go par défaut) : deux lectures
    # simultanées (--concurrency=2) restent sous ces 6 Go. Baisser ce réglage si la concurrence augmente.
    mem_limit: 6g
    # Petit processus init (PID 1) : LibreOffice ou Tesseract arrêtés avec une lecture interrompue sont
    # récoltés au lieu de rester à l'état de zombie jusqu'au redémarrage du conteneur.
    init: true
    volumes:
      - *montage-fichiers
      - *montage-archives
      - *montage-modeles
      # Sauvegardes de chaque nuit : dossier du PC (DOSSIER_SAUVEGARDES_PC, idéalement un autre disque)
      # ou sous-dossier « sauvegardes » du partage du serveur (docker-compose.serveur.yml).
      - ${DOSSIER_SAUVEGARDES_PC:-./donnees/sauvegardes}:/sauvegardes
      # Configuration copiée avec chaque sauvegarde : sa clé DJANGO_SECRET_KEY garde valides les codes
      # d'accès des entreprises à la GED après une restauration.
      - ./.env:/configuration/.env:ro
    depends_on:
      backend:
        condition: service_started

  # Voix de l'assistant (transcription Whisper, lecture Piper) : un seul processus,
  # pour ne charger les modèles qu'une fois en mémoire.
  voix:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--queues=voix", "--concurrency=1", "--hostname=voix@%h"]
    depends_on:
      backend:
        condition: service_started

  # Moteur d'IA local de l'assistant (modèles gratuits, rien n'est envoyé sur Internet).
  # Carte graphique NVIDIA : voir docker-compose.gpu.yml.
  ollama:
    image: ollama/ollama:0.40.15
    restart: unless-stopped
    logging: *journal
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - modeles_ia:/root/.ollama

  web:
    build: ./frontend
    restart: unless-stopped
    logging: *journal
    environment:
      MODE_GED: ${MODE_GED:-aucun}
      GED_URL_PUBLIQUE: ${GED_URL_PUBLIQUE:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # Certificats HTTPS de la GED (mode Internet) et journal des connexions publiques.
      - caddy_donnees:/data
      - caddy_config:/config
      - ./donnees/journaux:/journaux
    depends_on:
      - backend

volumes:
  base_donnees:
  caddy_donnees:
  caddy_config:
  modeles_ia:
  modeles_voix:
  valkey_donnees:
